name: vibemessenger

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibe-messenger:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      MESSENGER_SECRET: "${MESSENGER_SECRET:?set MESSENGER_SECRET in .env}"
      MESSENGER_DOMAIN: "${DOMAIN}"
    volumes:
      - data:/app/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  data:
  caddy_data:
  caddy_config:

networks:
  web:
