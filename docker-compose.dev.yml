name: vibemessenger-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibe-messenger:dev
    restart: unless-stopped
    environment:
      PORT: "3000"
      MESSENGER_SECRET: "${MESSENGER_SECRET:-dev-insecure-secret-change-me}"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - dev_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dev_data:
